Autor: PDN
Objetivo: Monitorear la estrategia Optimazed BTC System en múltiples marcos temporales (1d, 4h, 1h, 15m).

<body class="p-4 md:p-8">

    <!-- Encabezado y Precio Global -->
    <header class="text-center mb-8">

        </p>

        <div class="text-sm text-gray-500 mt-1">Última Actualización: <span id="lastUpdated">--</span> | Intervalo: 5 min</div>
    </header>

    <!-- Caja de Alerta Unificada (Nueva) -->
    <section class="mb-8 p-4 rounded-xl module-card">
        <h2 class="text-xl font-bold mb-3 text-yellow-400">ALERTA UNIFICADA Y PLAN DE ACCIÓN</h2>
        <div id="final-alert-box" class="p-4 rounded-lg text-sm transition-colors duration-300 bg-gray-700 text-gray-300">
            Esperando datos de todos los timeframes para consolidar la señal...
        </div>
    </section>
    
    <!-- Grid de Monitores de Timeframe -->
    <main id="monitorGrid" class="grid monitor-grid gap-6">
        <!-- Los módulos se generarán aquí por JavaScript -->
    </main>

    <!-- Script de la Aplicación -->
    <script>
        // --- SECCIÓN 1: CONFIGURACIÓN Y CONSTANTES ---

        // Parámetros optimizados de la estrategia
        const PARAMS = {
            EMA_FAST: 50,
            EMA_SLOW: 200,
            MACD_FAST: 12,
            MACD_SLOW: 26,
            MACD_SIGNAL: 9,
            RSI_PERIOD: 9,
            RSI_OVERSOLD: 25,
            RSI_OVERBOUGHT: 75,
            ATR_PERIOD: 14,
            ATR_SL_MULTIPLIER: 2.0, // R = Riesgo base
            ATR_TP_MULTIPLIER: 4.0, // R/R 1:2
            TRAILING_STOP_ATR_MULTIPLIER: 1.0, // Para trailing SL avanzado
            SIGNIFICANT_LOW_PERIOD: 5, // Número de velas para buscar el mínimo significativo
        };

        // Timeframes a monitorear
        const TIMEFRAMES = {
            '1d': 'Diario',
            '4h': '4 Horas',
            '1h': '1 Hora',
            '15m': '15 Minutos'
        };

        // Estado simulado de la posición (NO PERSISTENTE)
        let positions = {};
        
        // Estado de la señal anterior para evitar alertas repetidas y para la lógica de confluencia
        let previousSignals = {}; 
        let currentSignals = {}; // Almacena el resultado de la señal para la confluencia

        // --- SECCIÓN 2: UTILERÍAS DE CÁLCULO DE INDICADORES (Mantenido de versiones anteriores) ---

        function calculateEMA(data, period) {
            if (data.length < period) return [];
            const k = 2 / (period + 1);
            let emaArray = new Array(data.length).fill(null);
            let sum = 0;
            for (let i = 0; i < period; i++) { sum += data[i]; }
            emaArray[period - 1] = sum / period;
            for (let i = period; i < data.length; i++) {
                emaArray[i] = (data[i] - emaArray[i - 1]) * k + emaArray[i - 1];
            }
            return emaArray;
        }

        function calculateMACD(closes) {
            const ema12 = calculateEMA(closes, PARAMS.MACD_FAST);
            const ema26 = calculateEMA(closes, PARAMS.MACD_SLOW);

            const macdLineArray = ema12.map((val, i) =>
                val !== null && ema26[i] !== null ? val - ema26[i] : null
            ).filter(val => val !== null);

            const macdSignalArray = calculateEMA(macdLineArray, PARAMS.MACD_SIGNAL);

            const historyLength = macdLineArray.length;
            
            // CORRECCIÓN: Definir macdLine antes de calcular histogram
            const macdLine = macdLineArray[historyLength - 1]; 
            const macdSignal = macdSignalArray[macdSignalArray.length - 1];
            const histogram = macdLine - macdSignal;
            
            // macdResult no está definido, se retorna el objeto directamente
            return { macdLine, macdSignal, histogram, historyLength };
        }

        function calculateRSI(closes, period) {
             const changes = [];
            for (let i = 1; i < closes.length; i++) { changes.push(closes[i] - closes[i - 1]); }
            const rsiArray = new Array(closes.length).fill(null);
            if (changes.length < period) return [];
            let initialGain = 0;
            let initialLoss = 0;
            for (let i = 0; i < period; i++) {
                if (changes[i] > 0) initialGain += changes[i];
                if (changes[i] < 0) initialLoss -= changes[i];
            }
            let avgGain = initialGain / period;
            let avgLoss = initialLoss / period;
            const rs = avgGain / avgLoss;
            rsiArray[period] = 100 - (100 / (1 + rs));
            for (let i = period + 1; i < closes.length; i++) {
                const change = changes[i - 1];
                let currentGain = 0;
                let currentLoss = 0;
                if (change > 0) currentGain = change;
                if (change < 0) currentLoss = -change;
                avgGain = (avgGain * (period - 1) + currentGain) / period;
                avgLoss = (avgLoss * (period - 1) + currentLoss) / period;
                const currentRS = avgGain / avgLoss;
                rsiArray[i] = 100 - (100 / (1 + currentRS));
            }
            return rsiArray.filter(val => val !== null);
        }

        function calculateATR(history, period) {
            if (history.length < period) return { atr: 0 };
            const trueRanges = [];
            for (let i = 1; i < history.length; i++) {
                const h = history[i].high;
                const l = history[i].low;
                const prevC = history[i - 1].close;
                const tr = Math.max(h - l, Math.abs(h - prevC), Math.abs(l - prevC));
                trueRanges.push(tr);
            }
            let atrArray = new Array(trueRanges.length).fill(null);
            let sumTR = 0;
            for (let i = 0; i < period; i++) { sumTR += trueRanges[i]; }
            atrArray[period - 1] = sumTR / period;
            for (let i = period; i < trueRanges.length; i++) {
                atrArray[i] = (atrArray[i - 1] * (period - 1) + trueRanges[i]) / period;
            }
            const atr = atrArray[atrArray.length - 1];
            return { atr: atr || 0 };
        }

        /**
         * Aplica la estrategia EMA/MACD/RSI a los datos históricos y al precio actual.
         * Devuelve la señal (LONG, SHORT, NEUTRO) y la razón.
         */
        function applyStrategy(history, timeframe) {
            if (history.length < PARAMS.EMA_SLOW) {
                return { signal: 'NEUTRO', reason: `Requiere ${PARAMS.EMA_SLOW} velas.`, indicators: {}, risk: {} };
            }

            const closes = history.map(v => v.close);
            const currentPrice = closes[closes.length - 1];
            
            const ema50 = calculateEMA(closes, PARAMS.EMA_FAST).pop();
            const ema200 = calculateEMA(closes, PARAMS.EMA_SLOW).pop();
            const rsi = calculateRSI(closes, PARAMS.RSI_PERIOD).pop();
            const macdResult = calculateMACD(closes); // Aquí macdResult se define
            const atrResult = calculateATR(history, PARAMS.ATR_PERIOD);

            const macdLine = macdResult.macdLine;
            const macdSignal = macdResult.macdSignal;
            const atr = atrResult.atr;
            
            // Condiciones de Entrada
            const isBullishTrend = ema50 > ema200;
            const isBearishTrend = ema50 < ema200;
            const isBullishMomentum = macdLine > macdSignal;
            const isBearishMomentum = macdLine < macdSignal;
            const isRSIStrong = rsi > 50 && rsi <= PARAMS.RSI_OVERBOUGHT;
            const isRSIWeak = rsi < 50 && rsi >= PARAMS.RSI_OVERSOLD;

            let signal = 'NEUTRO';
            let reason = 'Esperando confluencia de indicadores.';

            if (isBullishTrend && isBullishMomentum && isRSIStrong) {
                signal = 'LONG';
                reason = 'Tendencia Alcista (EMA 50/200), Momentum Positivo (MACD) y Fuerza (RSI > 50).';
            } else if (isBearishTrend && isBearishMomentum && isRSIWeak) {
                signal = 'SHORT';
                reason = 'Tendencia Bajista (EMA 50/200), Momentum Negativo (MACD) y Debilidad (RSI < 50).';
            } else {
                 reason = 'Condiciones de entrada no se cumplen simultáneamente.';
            }

            // Gestión de Riesgo (Simulación de Trailing Stop)
            let risk = {
                R: atr * PARAMS.ATR_SL_MULTIPLIER,
                SL: null,
                TP: null,
                message: 'No hay posición activa.'
            };
            
            // Lógica de Trailing Stop avanzada (Mantener la complejidad para consistencia)
            if (positions[timeframe] && positions[timeframe].isActive) {
                const entryPrice = positions[timeframe].entryPrice;
                const riskR = atr * PARAMS.ATR_SL_MULTIPLIER;
                
                if (positions[timeframe].type === 'LONG') {
                    risk.SL = entryPrice - riskR; 
                    risk.TP = entryPrice + riskR * PARAMS.ATR_TP_MULTIPLIER; 
                    const gainInR = (currentPrice - entryPrice) / riskR;

                    if (gainInR >= 1.0) {
                        const lowHistory = history.slice(history.length - 1 - PARAMS.SIGNIFICANT_LOW_PERIOD, history.length - 1);
                        const lastSignificantLow = lowHistory.reduce((min, candle) => Math.min(min, candle.low), entryPrice);
                        const trailingSL = lastSignificantLow - atr * PARAMS.TRAILING_STOP_ATR_MULTIPLIER;
                        
                        risk.SL = Math.max(entryPrice, trailingSL);
                        risk.message = `Posición LONG activa. Trailing SL avanzado: $${formatPrice(risk.SL)}.`;
                    }
                } else if (positions[timeframe].type === 'SHORT') {
                    risk.SL = entryPrice + riskR;
                    risk.TP = entryPrice - riskR * PARAMS.ATR_TP_MULTIPLIER;
                    const lossInR = (entryPrice - currentPrice) / riskR;
                    
                    if (lossInR >= 1.0) {
                         const highHistory = history.slice(history.length - 1 - PARAMS.SIGNIFICANT_LOW_PERIOD, history.length - 1);
                        const lastSignificantHigh = highHistory.reduce((max, candle) => Math.max(max, candle.high), entryPrice);
                        const trailingSL = lastSignificantHigh + atr * PARAMS.TRAILING_STOP_ATR_MULTIPLIER;
                        
                        risk.SL = Math.min(entryPrice, trailingSL); 
                        risk.message = `Posición SHORT activa. Trailing SL avanzado: $${formatPrice(risk.SL)}.`;
                    }
                }
                risk.R = riskR;
            }


            return {
                signal,
                reason,
                indicators: {
                    ema50: ema50 || 0,
                    ema200: ema200 || 0,
                    macdLine: macdLine || 0,
                    macdSignal: macdSignal || 0,
                    rsi: rsi || 0,
                    atr: atr || 0,
                },
                risk,
                currentPrice: currentPrice
            };
        }

        // --- SECCIÓN 4: LÓGICA DE CONFLUENCIA Y ALERTA UNIFICADA ---

        /**
         * Determina el mensaje final de alerta basado en las reglas de confluencia (Caso 1, 2, 3).
         * @param {object} signals - Objeto con las señales de todos los timeframes (1d, 4h, 1h, 15m).
         * @returns {{action: string, message: string, confidence: number}} Mensaje de acción final.
         */
        function getFinalActionAndMessage(signals) {
            const S1D = signals['1d'];
            const S4H = signals['4h'];
            const S1H = signals['1h'];
            const S15M = signals['15m'];

            if (!S1D || !S4H || !S1H || !S15M) {
                 return { action: 'NEUTRO', message: 'Esperando todas las señales...', confidence: 0 };
            }

            let action = 'NEUTRO';
            let message = 'El mercado está en pausa. Prioridad: Proteger capital.';
            let confidence = 0; // 0 (Neutral), 1 (Bajo), 2 (Medio), 3 (Alto)
            let alignment = 0; // Contador de timeframes LONG/SHORT

            const isLong = (s) => s === 'LONG';
            const isShort = (s) => s === 'SHORT';
            const isNeutral = (s) => s === 'NEUTRO';

            // Contar alineación (excluyendo 15m, que es la ejecución)
            if (isLong(S1D)) alignment++;
            if (isLong(S4H)) alignment++;
            if (isLong(S1H)) alignment++;
            if (isShort(S1D)) alignment--;
            if (isShort(S4H)) alignment--;
            if (isShort(S1H)) alignment--;
            
            const totalAligned = Math.abs(alignment);
            
            // CASO 1: 1D LONG (Sesgo Alcista)
            if (isLong(S1D)) {
                action = 'LONG';
                if (isLong(S4H)) {
                    // Alineación fuerte
                    if (isLong(S1H) && isLong(S15M)) {
                        message = '¡ALINEACIÓN TOTAL LONG! Tendencia fuerte. Ejecución inmediata LONG si no está en sobrecompra. Riesgo COMPLETO (1R).';
                        confidence = 3;
                    } else if (isNeutral(S1H) || isShort(S1H)) {
                        message = 'Fuerte confluencia 1D/4H LONG. Buscar entrada LONG en 1H/15M al primer giro alcista (compra en el dip).';
                        confidence = 2;
                    } else {
                        message = '1D/4H Long, pero 1H/15m están corrigiendo. Esperar con paciencia el giro 15m a LONG.';
                        confidence = 2;
                    }
                } else if (isNeutral(S4H)) {
                    message = '1D Long, 4H Neutral (consolidación). Operar LONG con menor exposición (0.5R). Esperar confirmación en 1H.';
                    confidence = 1;
                } else if (isShort(S4H)) {
                    action = 'NEUTRO';
                    message = 'Corrección profunda (4H Short) contra 1D Long. No vender, pero ESPERAR que 1H/15m giren a LONG antes de entrar.';
                    confidence = 0;
                }
            }
            
            // CASO 3: 1D SHORT (Sesgo Bajista)
            else if (isShort(S1D)) {
                action = 'SHORT';
                 if (isShort(S4H)) {
                    // Alineación fuerte
                    if (isShort(S1H) && isShort(S15M)) {
                        message = '¡ALINEACIÓN TOTAL SHORT! Tendencia bajista fuerte. Ejecución inmediata SHORT si no está en sobreventa. Riesgo COMPLETO (1R).';
                        confidence = 3;
                    } else if (isNeutral(S1H) || isLong(S1H)) {
                         message = 'Fuerte confluencia 1D/4H SHORT. Buscar entrada SHORT en 1H/15M al primer giro bajista (vender en el rebote).';
                         confidence = 2;
                    } else {
                        message = '1D/4H Short, pero 1H/15m están rebotando. Esperar con paciencia el giro 15m a SHORT.';
                        confidence = 2;
                    }
                } else if (isNeutral(S4H)) {
                    message = '1D Short, 4H Neutral (consolidación). Operar SHORT con menor exposición (0.5R). Buscar agotamiento de rebotes en 1H.';
                    confidence = 1;
                } else if (isLong(S4H)) {
                    action = 'NEUTRO';
                    message = 'Corrección profunda (4H Long) contra 1D Short. No comprar, pero ESPERAR que 1H/15m giren a SHORT antes de entrar.';
                    confidence = 0;
                }
            }

            // CASO 2: 1D NEUTRAL (Consolidación / Rango)
            else if (isNeutral(S1D)) {
                confidence = 0; // Prioridad es no operar
                if (isLong(S4H) && isLong(S1H)) {
                    action = 'LONG';
                    message = 'RANGO ALCISTA. Se puede operar LONG táctico (0.5R) en soportes del rango. Objetivos cortos y break-even rápido.';
                } else if (isShort(S4H) && isShort(S1H)) {
                    action = 'SHORT';
                    message = 'RANGO BAJISTA. Se puede operar SHORT táctico (0.5R) en resistencias del rango. Objetivos cortos.';
                } else {
                    action = 'NEUTRO';
                    message = '1D NEUTRAL. Señales mezcladas. Evitar operar, riesgo de ruptura falsa alto. Prioridad: Proteger capital.';
                }
            }

            // Regla universal: Mínimo 2/3 alineados (1D, 4H, 1H)
            if (action !== 'NEUTRO' && totalAligned < 2) {
                action = 'NEUTRO';
                message = 'ALINEACIÓN DÉBIL. Se requiere que al menos 2 de los marcos principales (1D, 4H, 1H) apunten en la misma dirección.';
                confidence = 0;
            }


            return { action, message, confidence };
        }
        
        // --- SECCIÓN 5: MANEJO DE API, RENDERING Y BUCLE PRINCIPAL ---
        
        function playAlertSound(frequency = 600, duration = 0.2, volume = 0.5) {
            // [CÓDIGO playAlertSound... Mantenido]
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                gainNode.gain.value = volume;
                oscillator.frequency.value = frequency;
                oscillator.type = 'square'; 

                oscillator.start();
                setTimeout(() => {
                    oscillator.stop();
                }, duration * 1000);

            } catch (e) {
                console.warn("La API de Audio no está disponible o el usuario no ha interactuado con la página.", e);
            }
        }
        
        async function fetchPriceData(interval, limit = 500) {
            // [CÓDIGO fetchPriceData... Mantenido]
            const url = `https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=${limit}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();

                if (!response.ok || data.code) {
                     // Si la API de Binance devuelve un error, data.code existe
                    throw new Error(`Binance API Error: ${data.msg || response.statusText}`);
                }

                return data.map(candle => ({
                    time: candle[0],
                    open: parseFloat(candle[1]),
                    high: parseFloat(candle[2]),
                    low: parseFloat(candle[3]),
                    close: parseFloat(candle[4]),
                    volume: parseFloat(candle[5]),
                }));

            } catch (error) {
                console.error(`Error al obtener datos para ${interval}:`, error.message);
                throw new Error('Fallo en la conexión o la respuesta de la API de Binance.');
            }
        }

        function formatPrice(price) {
            // [CÓDIGO formatPrice... Mantenido]
            if (price === 0 || price === null || isNaN(price)) return '---';
            const decimals = price >= 1000 ? 0 : 2; 
            return price.toFixed(decimals).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function createModuleHTML(timeframe, title) {
            // [CÓDIGO createModuleHTML... Mantenido]
            return `
                <div id="module-${timeframe}" class="module-card rounded-xl p-5 md:p-6 shadow-2xl flex flex-col justify-between">
                    <h2 class="text-xl md:text-2xl font-bold mb-3 text-cyan-400">${title}</h2>
                    
                    <!-- Sección de Señal -->
                    <div id="signal-${timeframe}" class="signal-NEUTRO text-2xl py-3 px-4 mb-4 rounded-lg text-center transition-colors duration-300">
                        NEUTRO
                    </div>
                    
                    <!-- Precio Actual -->
                    <div class="mb-4">
                        <span class="text-sm text-gray-400">Precio de Cierre:</span>
                        <div id="price-${timeframe}" class="text-2xl font-extrabold text-green-400">---</div>
                    </div>

                    <!-- Indicadores Clave -->
                    <div class="space-y-2 text-sm">
                        <h3 class="font-semibold text-gray-400 border-b border-gray-700 pb-1 mb-2">Indicadores Clave</h3>
                        <p>EMA(50) / EMA(200): <span id="ema-crossover-${timeframe}" class="indicator-value">--- / ---</span></p>
                        <p>MACD Line / Signal: <span id="macd-line-signal-${timeframe}" class="indicator-value">--- / ---</span></p>
                        <p>RSI(9): <span id="rsi-${timeframe}" class="indicator-value">---</span></p>
                        <p>ATR(14): <span id="atr-${timeframe}" class="indicator-value">---</span></p>
                    </div>

                    <!-- Gestión de Riesgo -->
                    <div class="mt-4 pt-4 border-t border-gray-700 space-y-2 text-sm">
                        <h3 class="font-semibold text-gray-400">Gestión de Riesgo (ATR)</h3>
                        <p class="text-yellow-400">Riesgo Base (R=2x ATR): <span id="risk-r-${timeframe}" class="indicator-value">---</span></p>
                        <p>Stop-Loss (SL): <span id="risk-sl-${timeframe}" class="text-red-400 font-bold">---</span></p>
                        <p>Take-Profit (TP): <span id="risk-tp-${timeframe}" class="text-green-400 font-bold">---</span></p>
                        <p class="text-xs text-gray-500" id="risk-message-${timeframe}">Sin posición activa.</p>
                    </div>

                    <!-- Botón de Simulación de Trade -->
                    <div class="mt-4 flex gap-2">
                        <button onclick="handleTradeAction('${timeframe}')" id="btn-trade-${timeframe}"
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-semibold transition-colors duration-200">
                            Simular Apertura
                        </button>
                    </div>

                    <!-- Razón de la Señal -->
                    <div class="mt-4 text-xs text-gray-500 italic border-t border-gray-700 pt-3">
                        <span id="reason-${timeframe}">Cargando datos y calculando...</span>
                    </div>
                </div>
            `;
        }

        function renderAnalysis(timeframe, result, currentPrice) {
            // [CÓDIGO renderAnalysis... Mantenido]
             const module = document.getElementById(`module-${timeframe}`);
            if (!module) return;

            // Almacenar la señal actual para la lógica de confluencia
            currentSignals[timeframe] = result.signal;


            // Actualizar precio global (solo para el último timeframe que se procesa)
            document.getElementById('globalPrice').textContent = `$${formatPrice(currentPrice)}`;
            document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString('es-ES');
            
            // --- Actualizar Señal ---
            const signalElement = document.getElementById(`signal-${timeframe}`);
            const reasonElement = document.getElementById(`reason-${timeframe}`);
            const btnTrade = document.getElementById(`btn-trade-${timeframe}`);

            signalElement.className = `signal-${result.signal} text-2xl py-3 px-4 mb-4 rounded-lg text-center transition-colors duration-300`;
            signalElement.textContent = result.signal;
            reasonElement.textContent = result.reason;

            // --- Control de Botón de Trade (Simulación) ---
            if (positions[timeframe] && positions[timeframe].isActive) {
                btnTrade.textContent = `CERRAR Posición ${positions[timeframe].type} (Simular)`;
                btnTrade.className = 'w-full bg-yellow-600 hover:bg-yellow-700 text-white py-2 rounded-lg text-sm font-semibold transition-colors duration-200';
            } else {
                 btnTrade.textContent = 'Simular Apertura';
                 if (result.signal === 'LONG' || result.signal === 'SHORT') {
                    btnTrade.className = 'w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg text-sm font-semibold transition-colors duration-200';
                 } else {
                    btnTrade.className = 'w-full bg-gray-600 cursor-not-allowed text-gray-400 py-2 rounded-lg text-sm font-semibold';
                 }
            }


            // --- Actualizar Indicadores ---
            document.getElementById(`price-${timeframe}`).textContent = `$${formatPrice(currentPrice)}`;
            document.getElementById(`ema-crossover-${timeframe}`).textContent = 
                `${result.indicators.ema50.toFixed(0)} / ${result.indicators.ema200.toFixed(0)}`;
            document.getElementById(`macd-line-signal-${timeframe}`).textContent = 
                `${result.indicators.macdLine.toFixed(4)} / ${result.indicators.macdSignal.toFixed(4)}`;
            document.getElementById(`rsi-${timeframe}`).textContent = 
                `${result.indicators.rsi.toFixed(2)}`;
            document.getElementById(`atr-${timeframe}`).textContent = 
                `$${formatPrice(result.indicators.atr)}`;

            // --- Actualizar Gestión de Riesgo ---
            document.getElementById(`risk-r-${timeframe}`).textContent = result.risk.R ? `$${formatPrice(result.risk.R)}` : '---';
            document.getElementById(`risk-sl-${timeframe}`).textContent = result.risk.SL ? `$${formatPrice(result.risk.SL)}` : '---';
            document.getElementById(`risk-tp-${timeframe}`).textContent = result.risk.TP ? `$${formatPrice(result.risk.TP)}` : '---';
            document.getElementById(`risk-message-${timeframe}`).textContent = result.risk.message;
        }

        async function runAnalysis(timeframe) {
            const interval = timeframe;
            try {
                const history = await fetchPriceData(interval, 500); 
                const currentPrice = history[history.length - 1].close;

                const result = applyStrategy(history, timeframe);
                renderAnalysis(timeframe, result, currentPrice);

                // Si es el último timeframe (15m), consolida la alerta.
                if (timeframe === '15m') {
                    consolidateAlert();
                }

            } catch (error) {
                console.error(`Error al ejecutar el análisis para ${timeframe}:`, error);
                const reasonElement = document.getElementById(`reason-${timeframe}`);
                const signalElement = document.getElementById(`signal-${timeframe}`);
                if (reasonElement) reasonElement.textContent = `ERROR: ${error.message}`;
                if (signalElement) signalElement.textContent = `ERROR`;
            }
        }

        function consolidateAlert() {
            const alertBox = document.getElementById('final-alert-box');
            
            // Asegurarse de que tenemos las 4 señales
            if (Object.keys(currentSignals).length !== 4) return;

            const { action, message, confidence } = getFinalActionAndMessage(currentSignals);
            
            let colorClass = 'bg-gray-700 text-gray-300';
            let alertMessage = `**ACCIÓN FINAL: ${action}** (${confidence}/3 Confianza) \n\n${message}`;
            let playSound = false;

            // --- LÓGICA DE COLORACIÓN DE LA ALERTA UNIFICADA ---
            if (action === 'LONG') {
                colorClass = 'alert-bg-long text-white'; // Utiliza clase CSS personalizada
                if (confidence >= 2 && previousSignals.finalAction !== action) {
                    playSound = true;
                }
            } else if (action === 'SHORT') {
                colorClass = 'alert-bg-short text-white'; // Utiliza clase CSS personalizada
                 if (confidence >= 2 && previousSignals.finalAction !== action) {
                    playSound = true;
                }
            } else {
                colorClass = 'alert-bg-neutral text-gray-900'; // Utiliza clase CSS personalizada (Amarillo Oscuro)
            }
            // ---------------------------------------------------
            
            if (playSound) {
                playAlertSound(action === 'LONG' ? 880 : 440);
                alert(`*** ALERTA EBy 1.0 ***\nAcción: ${action} (${confidence}/3)\n\n${message}`);
            }

            // Almacenar el estado final
            previousSignals.finalAction = action;

            // Renderizar el mensaje final
            alertBox.className = `p-4 rounded-lg text-sm transition-colors duration-300 whitespace-pre-line ${colorClass}`;
            alertBox.innerHTML = alertMessage.replace(/\n/g, '<br>');
        }
        
        function runAllTimeframes() {
            Object.keys(TIMEFRAMES).forEach(timeframe => {
                runAnalysis(timeframe);
            });
        }

        // --- SECCIÓN 6: LÓGICA DE INTERACCIÓN Y BUCLE ---

        function handleTradeAction(timeframe) {
            // [CÓDIGO handleTradeAction... Mantenido]
            const result = document.getElementById(`signal-${timeframe}`).textContent;
            const price = parseFloat(document.getElementById(`price-${timeframe}`).textContent.replace(/\$|\./g, '').replace(',', '.'));
            
            if (positions[timeframe] && positions[timeframe].isActive) {
                // CERRAR POSICIÓN
                alert(`POSICIÓN CERRADA: ${positions[timeframe].type} en ${timeframe}. \nCierre simulado a $${formatPrice(price)}.`);
                positions[timeframe] = null; // Limpiar el estado de la posición
            } else if (result === 'LONG' || result === 'SHORT') {
                // ABRIR POSICIÓN
                positions[timeframe] = {
                    isActive: true,
                    type: result,
                    entryPrice: price,
                    timeframe: timeframe,
                    date: new Date().toISOString()
                };
                alert(`POSICIÓN ABIERTA: ${result} en ${timeframe}. \nPrecio de entrada: $${formatPrice(price)}`);
            } else {
                alert('No se puede abrir. La señal no es LONG ni SHORT.');
            }

            runAnalysis(timeframe);
        }

        function initApp() {
            const monitorGrid = document.getElementById('monitorGrid');
            if (monitorGrid) {
                monitorGrid.innerHTML = '';
                Object.entries(TIMEFRAMES).forEach(([key, title]) => {
                    monitorGrid.innerHTML += createModuleHTML(key, title);
                });
            }

            runAllTimeframes();
            
            // Configurar la actualización cada 5 minutos (300,000 ms)
            setInterval(runAllTimeframes, 300000); 
        }

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
